# =====================================================================
# OpenAmber thermostaat - WT32S3-21S rond display (ZX2D10GE01R-W4848#B)
# Praat via ESP-NOW (packet_transport) met het OpenAmber-display op de warmtepomp.
#
# Wat er over de lucht gaat (alles als sensor, zie ESPHome packet_transport):
#   OpenAmber -> hier : tw tc tuo tui ta rt (temperaturen)
#                       slo shi mode (werkelijke setpoints en modus, 0=uit 1=verwarmen 2=koelen)
#                       twa err legp wv twp twv lega (status, 0/1)
#   hier -> OpenAmber : bt bh dp (BME680)
#                       cmd (commando: volgnummer + modus + setpoints in een getal)
#
# Opbouw van dit bestand:
#   1. Basis          2. GPIO-overzicht   3. Hardware
#   4. Sensoren       5. Bediening        6. Scripts
#   7. ESP-NOW        8. LVGL Designer-blok (wordt door de Designer gegenereerd)
# =====================================================================

# ---------------------------------------------------------------------
# 1. BASIS
# ---------------------------------------------------------------------
substitutions:
  peer_mac: "20:6E:F1:8B:05:DC"   # MAC van het OpenAmber-display

globals:
  - id: user_is_adjusting         # true zolang er aan de knop wordt gedraaid
    type: bool
    initial_value: 'false'
  - id: cmd_seq                   # volgnummer van het laatste commando (1-99), blijft bewaard
    type: int
    restore_value: yes
    initial_value: '0'
  - id: mode_code                 # gekozen modus: 0=uit, 1=verwarmen, 2=koelen
    type: int
    initial_value: '0'

esphome:
  name: openamber-thermostaat
  friendly_name: OpenAmber Thermostaat
  on_boot:
    then:
      - script.execute: reset_backlight_timer

esp32:
  variant: esp32s3
  flash_size: 8MB                 # module heeft 16 MB; wijzigen vraagt een flash via USB (partitietabel)
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: 

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: OpenAmber Therm Fallback Hotspot
    password: "vC8NEYetXCtc"

captive_portal:

# ---------------------------------------------------------------------
# 2. GPIO-OVERZICHT  WT32S3-21S (ZX2D10GE01R-W4848#B), zonder touch
# ---------------------------------------------------------------------
# GPIO0   BOOT-knop (strapping) / RGB_D2          (scherm-model)
# GPIO1   EXT_IO4 -> I2C SCL, BME680 (adres 0x77) (i2c)
# GPIO2   EXT_IO3 -> I2C SDA, BME680 (adres 0x77) (i2c)
# GPIO3   Drukknop draaiknop (strapping, laag = ingedrukt)
# GPIO4   Ledring, 13x XT1063 single-bus          (esp32_rmt_led_strip)
# GPIO5   Draaiknop B, Hall-encoder (TP_SDA)      (rotary_encoder pin_b)
# GPIO6   Draaiknop A, Hall-encoder (TP_SCL)      (rotary_encoder pin_a)
# GPIO7   Trilmotor (TP_INT)                      (nog niet gebruikt)
# GPIO8-18, 21, 39, 40, 42, 45, 46, 48
#         RGB-bus van het scherm (D2..D15, DE, HS, VS, PCLK, CS)
#                                                 (scherm-model, niet aanraken)
# GPIO19  EXT_IO1, ook USB D-                     (vrij)
# GPIO20  EXT_IO2, ook USB D+                     (vrij)
# GPIO35-37  Octal PSRAM                          (niet gebruiken)
# GPIO38  Backlight, actief hoog                  (ledc)
# GPIO41  LCD_MOSI / RGB_D1                       (spi mosi_pin)
# GPIO43/44  UART0 TX/RX, downloadpoort en log    (niet gebruiken)
# GPIO47  LCD_SCLK / RGB_D0                       (spi clk_pin)
# EN      LCD_RST                                 (scherm-model)
#
# Strapping-pins: GPIO0, 3, 45, 46. Niet tijdens het opstarten
# tegen de standaardstand in vasthouden.
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# 3. HARDWARE
# ---------------------------------------------------------------------
spi:                              # alleen voor het scherm
  clk_pin:
    number: 47
    allow_other_uses: true        # pin wordt ook door de RGB-bus gebruikt
  mosi_pin:
    number: 41
    allow_other_uses: true

i2c:                              # BME680
  sda: GPIO2
  scl: GPIO1

output:
  - platform: ledc                # PWM voor de backlight
    id: display_led
    pin: 38
    zero_means_zero: true

light:
  - platform: monochromatic       # backlight van het scherm
    id: backlight
    output: display_led
    name: Backlight
    icon: mdi:brightness-percent
    default_transition_length: 500ms
    restore_mode: ALWAYS_ON

  - platform: esp32_rmt_led_strip # ledring (XT1063, GPIO4)
    pin: GPIO4
    num_leds: 13
    channel_colors: GRB
    chipset: WS2812
    id: status_leds
    name: "Status LEDs"
    default_transition_length: 300ms

display:
  - platform: mipi_rgb
    model: zx2d10ge01r-v4848

binary_sensor:
  - platform: gpio                # drukknop op de draaiknop
    id: encoder_button
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      then:
        - script.execute: reset_backlight_timer

  # --- Status van OpenAmber (gevuld vanuit de 0/1-sensoren in sectie 4) ---
  - platform: template
    id: remote_twa
    name: "Tapwater Aanwezig"

  - platform: template
    id: remote_err
    name: "Error Actief"
    device_class: problem

  - platform: template
    id: remote_legp
    name: "Legionellapreventie Actief"

  - platform: template
    id: remote_wv
    name: "Warmtevraag"
    device_class: running

  - platform: template
    id: remote_twp
    name: "Tapwater Pomp"
    device_class: running

  - platform: template
    id: remote_twv
    name: "Tapwater Vraag"
    device_class: running

  - platform: template
    id: remote_lega
    name: "Legionellacyclus Actief"
    device_class: running

# ---------------------------------------------------------------------
# 4. SENSOREN
# ---------------------------------------------------------------------
sensor:
  # --- Draaiknop (Hall-encoder) ---
  # Draaien verandert het lage setpoint; het commando gaat na een korte pauze.
  - platform: rotary_encoder
    id: knob
    internal: true
    pin_a:
      number: GPIO6
      inverted: true
      mode: INPUT
    pin_b:
      number: GPIO5
      inverted: true
      mode: INPUT
    on_clockwise:
      - globals.set:
          id: user_is_adjusting
          value: 'true'
      - script.execute: reset_backlight_timer
      - number.increment:
          id: target_low
          cycle: false
      - script.execute: send_command
      - script.execute: release_adjusting
    on_anticlockwise:
      - globals.set:
          id: user_is_adjusting
          value: 'true'
      - script.execute: reset_backlight_timer
      - number.decrement:
          id: target_low
          cycle: false
      - script.execute: send_command
      - script.execute: release_adjusting

  # --- BME680 (eigen meting in de kamer) ---
  # Let op: het verwarmingselement en de ledring maken de temperatuur te hoog;
  # vergelijk met een thermometer en corrigeer met "filters: - offset: -X".
  - platform: bme680
    address: 0x77                 # bevestigd door de I2C-scan
    update_interval: 15s
    temperature:
      id: bme_temp
      name: "Kamertemperatuur"
      internal: false
      on_value:
        then:
          - lvgl.label.update:
              id: home_label_roomtemp
              text: !lambda |-
                if (std::isnan(x)) return std::string("--");
                return str_sprintf("%.1f °C", x);
    humidity:
      id: bme_hum
      name: "Luchtvochtigheid"
      internal: false
    pressure:
      id: bme_pres
      name: "Luchtdruk"
      internal: false
    gas_resistance:
      id: bme_gas
      name: "Gasweerstand"
      internal: false

  # Dauwpunt, berekend uit temperatuur en luchtvochtigheid (Magnus-formule)
  - platform: template
    id: bme_dewpoint
    name: "Dauwpunt"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    internal: false
    lambda: |-
      float t = id(bme_temp).state;
      float rh = id(bme_hum).state;
      // Nog geen geldige meting? Dan ook geen dauwpunt.
      if (std::isnan(t) || std::isnan(rh) || rh <= 0) return NAN;
      const float b = 17.62, c = 243.12;
      float g = logf(rh / 100.0f) + (b * t) / (c + t);
      return (c * g) / (b - g);

  # Commando naar OpenAmber: volgnummer, modus en setpoints in een getal
  #   cmd = ((volgnr * 3 + modus) * 100 + laag*2) * 100 + hoog*2
  # Blijft leeg (NaN) tot de gebruiker iets verandert, zodat een herstart
  # geen oud commando herhaalt. Wordt gevuld door het script send_command.
  - platform: template
    id: cmd
    name: "Commando naar OpenAmber"
    internal: true
    update_interval: never

  # --- Temperaturen van OpenAmber (provider: openamber) ---
  # remote_id is de naam waaronder OpenAmber de waarde verstuurt (broadcast_id).
  - platform: packet_transport
    provider: openamber
    id: dhw_temperature_tw_sensor
    remote_id: tw
    name: "OpenAmber Tapwatertemperatuur (Tw)"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: home_label_tw
            text: !lambda |-
              if (std::isnan(x)) return std::string("--");
              return str_sprintf("%.1f °C", x);

  - platform: packet_transport
    provider: openamber
    id: heat_cool_temperature_tc
    remote_id: tc
    name: "OpenAmber CV-aanvoertemperatuur (Tc)"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    internal: true

  - platform: packet_transport
    provider: openamber
    id: outlet_temperature_tuo
    remote_id: tuo
    name: "OpenAmber CV-aanvoertemperatuur (Tuo)"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    internal: true

  - platform: packet_transport
    provider: openamber
    id: inlet_temperature_tui
    remote_id: tui
    name: "OpenAmber CV-retourtemperatuur (Tui)"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    internal: true

  - platform: packet_transport
    provider: openamber
    id: temperature_outside_ta
    remote_id: ta
    name: "OpenAmber Buitentemperatuur (Ta)"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    internal: true

  - platform: packet_transport
    provider: openamber
    id: room_temperature
    remote_id: rt
    name: "OpenAmber Ruimtetemperatuur (Tr)"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    internal: true

  # --- Werkelijke setpoints en modus van OpenAmber ---
  # Alleen overnemen als de gebruiker niet zelf aan de knop draait.
  - platform: packet_transport
    provider: openamber
    id: rx_slo
    remote_id: slo
    internal: true
    on_value:
      then:
        - lambda: |-
            if (!id(user_is_adjusting) && !std::isnan(x)) id(target_low).publish_state(x);

  - platform: packet_transport
    provider: openamber
    id: rx_shi
    remote_id: shi
    internal: true
    on_value:
      then:
        - lambda: |-
            if (!id(user_is_adjusting) && !std::isnan(x)) id(target_high).publish_state(x);

  - platform: packet_transport
    provider: openamber
    id: rx_mode
    remote_id: mode
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(user_is_adjusting) || std::isnan(x)) return;
            int m = (int) lroundf(x);
            if (m == 1)      id(hp_mode).publish_state("Verwarmen");
            else if (m == 2) id(hp_mode).publish_state("Koelen");
            else             id(hp_mode).publish_state("Uit");

  # --- Status van OpenAmber als 0/1 (binary sensors worden alleen bij een
  #     wijziging verstuurd; een sensor wordt periodiek herhaald) ---
  - platform: packet_transport
    provider: openamber
    id: rx_twa
    remote_id: twa
    internal: true
    on_value:
      then:
        - lambda: 'id(remote_twa).publish_state(x > 0.5f);'

  - platform: packet_transport
    provider: openamber
    id: rx_err
    remote_id: err
    internal: true
    on_value:
      then:
        - lambda: 'id(remote_err).publish_state(x > 0.5f);'

  - platform: packet_transport
    provider: openamber
    id: rx_legp
    remote_id: legp
    internal: true
    on_value:
      then:
        - lambda: 'id(remote_legp).publish_state(x > 0.5f);'

  - platform: packet_transport
    provider: openamber
    id: rx_wv
    remote_id: wv
    internal: true
    on_value:
      then:
        - lambda: 'id(remote_wv).publish_state(x > 0.5f);'

  - platform: packet_transport
    provider: openamber
    id: rx_twp
    remote_id: twp
    internal: true
    on_value:
      then:
        - lambda: 'id(remote_twp).publish_state(x > 0.5f);'

  - platform: packet_transport
    provider: openamber
    id: rx_twv
    remote_id: twv
    internal: true
    on_value:
      then:
        - lambda: 'id(remote_twv).publish_state(x > 0.5f);'

  - platform: packet_transport
    provider: openamber
    id: rx_lega
    remote_id: lega
    internal: true
    on_value:
      then:
        - lambda: 'id(remote_lega).publish_state(x > 0.5f);'

# ---------------------------------------------------------------------
# 5. BEDIENING (setpoints en modus)
# ---------------------------------------------------------------------
number:
  - platform: template            # setpoint verwarmen
    id: target_low
    name: "Setpoint laag"
    min_value: 15
    max_value: 25
    step: 0.5
    initial_value: 20.5
    optimistic: true
    unit_of_measurement: "°C"
    device_class: temperature
    on_value:
      then:
        # Boog en label volgen het setpoint (schaal 15,0-25,0 -> 150-250)
        - lvgl.arc.update:
            id: home_arc_setpoint
            value: !lambda 'return (int) lroundf(x * 10.0f);'
        - lvgl.label.update:
            id: home_label_setpoint
            text: !lambda |-
              return str_sprintf("%.1f °C", x);
        # Versturen gebeurt bewust vanuit de draaiknop, niet hier: anders
        # zou elke binnenkomende waarde van OpenAmber weer een commando geven.

  - platform: template            # setpoint koelen (nog niet met de knop te bedienen)
    id: target_high
    name: "Setpoint hoog"
    min_value: 15
    max_value: 30
    step: 0.5
    initial_value: 24.0
    optimistic: true
    unit_of_measurement: "°C"
    device_class: temperature
    set_action:
      - script.execute: send_command

select:
  - platform: template            # modus van de warmtepomp
    id: hp_mode
    name: "Modus"
    options: ["Uit", "Verwarmen", "Koelen"]
    initial_option: "Uit"
    optimistic: true
    set_action:
      - globals.set:
          id: user_is_adjusting
          value: 'true'
      - script.execute: send_command
      - script.execute: release_adjusting
    on_value:
      then:
        # Houd de modus als getal bij; send_command leest die
        - lambda: |-
            id(mode_code) = (x == "Verwarmen") ? 1 : (x == "Koelen") ? 2 : 0;

# ---------------------------------------------------------------------
# 6. SCRIPTS
# ---------------------------------------------------------------------
script:
  # Bouwt het commando (volgnummer + modus + setpoints) 600 ms na de laatste
  # draai-impuls of moduskeuze en publiceert het in de sensor "cmd".
  - id: send_command
    mode: restart
    then:
      - delay: 600ms
      - lambda: |-
          // Nieuw volgnummer 1-99; OpenAmber voert elk volgnummer maar een keer uit
          id(cmd_seq) = id(cmd_seq) % 99 + 1;
          int lo2 = (int) lroundf(id(target_low).state * 2.0f);
          int hi2 = (int) lroundf(id(target_high).state * 2.0f);
          float v = ((id(cmd_seq) * 3 + id(mode_code)) * 100 + lo2) * 100 + hi2;
          id(cmd).publish_state(v);

  # Zet de vlag "gebruiker draait" 3 s na de laatste klik weer uit.
  # Zolang de vlag aan staat, negeren we setpoints en modus die OpenAmber terugstuurt.
  - id: release_adjusting
    mode: restart
    then:
      - delay: 3s
      - globals.set:
          id: user_is_adjusting
          value: 'false'

  # Scherm en ledring 60 s aan na bediening of start
  - id: reset_backlight_timer
    mode: restart
    then:
      - light.turn_on:
          id: backlight
          brightness: 100%
      - light.turn_on:
          id: status_leds
          brightness: 100%
          red: 100%
          green: 50%
          blue: 10%               # warm oranje
      - delay: 60s
      - light.turn_off:
          id: backlight
          transition_length: 1s
      - light.turn_off:
          id: status_leds
          transition_length: 1s

# ---------------------------------------------------------------------
# 7. ESP-NOW (packet_transport)
# ---------------------------------------------------------------------
espnow:
  id: openamber_thermostat
  peers:
    - ${peer_mac}               # peers moeten hier geregistreerd zijn om pakketten te ontvangen

packet_transport:
  - platform: espnow
    id: transport_unicast
    espnow_id: openamber_thermostat
    peer_address: ${peer_mac}
    # Zet versleuteling pas aan als de verbinding werkt, op beide kanten tegelijk
    # (zelfde tekst in secrets.yaml bij beide projecten):
    # encryption: !secret espnow_key
    # rolling_code_enable: true
    providers:
      - name: openamber           # moet gelijk zijn aan "esphome: name:" van OpenAmber
    sensors:
      - id: bme_temp
        broadcast_id: bt
      - id: bme_hum
        broadcast_id: bh
      - id: bme_dewpoint
        broadcast_id: dp
      - id: cmd
        broadcast_id: cmd

