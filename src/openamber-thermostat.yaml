# =====================================================================
# OpenAmber thermostaat - WT32S3-21S rond display (ZX2D10GE01R-W4848#B)
# WT32-S3-WROVER
# Flash: 16MB
# PSRAM: 8MB
# Praat via packet_transport met het OpenAmber-display op de warmtepomp (ESP-NOW; UDP voor de virtuele display),
# zonder MAC-adres: broadcast met een gedeelde sleutel (espnow_key in secrets.yaml).
#
# Wat er over de lucht gaat (sensors en binary sensors, zie ESPHome packet_transport):
#   OpenAmber -> hier : tw tc tuo tui ta rt (temperaturen)
#                       slo shi mode (werkelijke setpoints en modus, 0=uit 1=verwarmen 2=koelen)
#                       twa err warn legp wv cd twp twv da lega (status, binary sensors)
#   hier -> OpenAmber : bt bh dp (BME680)
#                       cmd (commando: volgnummer + modus + setpoints in een getal)
# De statussen (twa err warn legp wv cd twp twv da lega) gaan als binary sensor over;
# alleen de setpoints en de modus zijn sensors (een climate kan niet rechtstreeks gedeeld worden).
#
# Opbouw van dit bestand:
#   1. Basis          2. GPIO-overzicht   3. Hardware
#   4. Sensoren       5. Bediening        6. Scripts
#   7. ESP-NOW        8. Scherm (LVGL; pagina's en scripts in thermostat/)
# =====================================================================

# ---------------------------------------------------------------------
# 1. BASIS
# ---------------------------------------------------------------------
# Geen MAC-adres nodig: de koppeling werkt met broadcast en een gedeelde sleutel.
# Zet in secrets.yaml (van dit project en van OpenAmber) dezelfde regel:
#   espnow_key: "een-eigen-lange-willekeurige-tekst"

globals:
  - id: pin_ok                    # true als de koppelcode van OpenAmber gelijk is aan de eigen koppelcode
    type: bool
    initial_value: 'false'
  - id: found_codes               # codes (MAC-staart) van OpenAmbers die recent zijn gehoord
    type: std::vector<int>
  - id: found_seen                # tijdstip (ms) waarop die code het laatst is gehoord
    type: std::vector<uint32_t>
  - id: user_is_adjusting         # true zolang er aan de knop wordt gedraaid
    type: bool
    initial_value: 'false'
  - id: cmd_seq                   # volgnummer van het laatste commando (1-99), blijft bewaard
    type: int
    restore_value: yes
    initial_value: '0'
  - id: mode_code                 # gekozen modus: 0=uit, 1=verwarmen, 2=koelen
    type: int
    initial_value: '0'
  - id: pending_mode              # modus voor het volgende commando; 3 = ongewijzigd laten
    type: int
    initial_value: '3'
  - id: knob_context              # 0 = Home (setpoint instellen), 1 = Overview, 2 = modus kiezen, 3 = koppelen
    type: int
    initial_value: '0'

esphome:
  name: openamber-thermostaat
  friendly_name: OpenAmber Thermostaat
  on_boot:
    - then:
        - script.execute: reset_backlight_timer
    - priority: -100              # nadat LVGL is opgestart
      then:
        # De Designer zet een zwarte "top_layer"; als die ondoorzichtig is, bedekt hij alle pagina's.
        # Daarom hier doorzichtig maken (blijft werken na een nieuwe export uit de Designer).
        - lambda: |-
            lv_obj_set_style_bg_opa(lv_layer_top(), LV_OPA_TRANSP, 0);
        - lvgl.page.show: canvas_2           # Home is de startpagina
        # Statusicoontjes op Overview: kleur, symbool en zichtbaarheid volgen de status van OpenAmber
        - script.execute: update_status_icons
        # TIJDELIJKE LED-TEST (daarna weghalen): na 1 s de ledring met een eigen kleur per led
        - delay: 1s
        - light.turn_on:
            id: status_leds
            brightness: 60%
            effect: "LED test"
        # Nog niet gekoppeld? Open dan na een paar seconden vanzelf de koppelpagina
        - delay: 3s
        - if:
            condition:
              lambda: 'return id(pair_code).state.empty();'
            then:
              - script.execute: show_pair

esp32:
  variant: esp32s3
  flash_size: 8MB                 # module heeft 16 MB; wijzigen vraagt een flash via USB (partitietabel)
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  logs:
    espnow: NONE              # niet op DEBUG/VERBOSE zetten: te veel logregels en geheugen
    sensor: WARN              # anders vult de log zich elke paar seconden met sensorwaarden
    number: WARN
    select: WARN
    binary_sensor: WARN
    light: WARN
    lvgl: NONE                # alleen aanzetten bij schermproblemen
api:
  encryption:
    key: "aYEOmndEDcqJUtjLSYFjcyZKx8FL1n3p5KV78sW+m3M="

#web_server:                       # firmware bijwerken via de browser: http://<ip-van-de-thermostaat>
#  port: 80
#  version: 3                      # geen wachtwoord: iedereen op je netwerk kan de pagina openen

ota:
  - platform: esphome
    encryption:
  - platform: web_server          # upload firmware.ota.bin via de webpagina van de thermostaat

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: OpenAmber Therm Fallback Hotspot
    password: "vC8NEYetXCtc"

captive_portal:

# ---------------------------------------------------------------------
# 2. GPIO-OVERZICHT  WT32S3-21S (ZX2D10GE01R-W4848#B), zonder touch
# ---------------------------------------------------------------------
# GPIO0   BOOT-knop (strapping) / RGB_D2          (scherm-model)
# GPIO1   EXT_IO4 -> I2C SCL, BME680 (adres 0x77) (i2c)
# GPIO2   EXT_IO3 -> I2C SDA, BME680 (adres 0x77) (i2c)
# GPIO3   Drukknop draaiknop (strapping, laag = ingedrukt)
# GPIO4   Ledring, 13x XT1063 single-bus          (esp32_rmt_led_strip)
# GPIO5   Draaiknop B, Hall-encoder (TP_SDA)      (rotary_encoder pin_b)
# GPIO6   Draaiknop A, Hall-encoder (TP_SCL)      (rotary_encoder pin_a)
# GPIO7   Trilmotor (TP_INT)                      (nog niet gebruikt)
# GPIO8-18, 21, 39, 40, 42, 45, 46, 48
#         RGB-bus van het scherm (D2..D15, DE, HS, VS, PCLK, CS)
#                                                 (scherm-model, niet aanraken)
# GPIO19  EXT_IO1, ook USB D-                     (vrij)
# GPIO20  EXT_IO2, ook USB D+                     (vrij)
# GPIO35-37  Octal PSRAM                          (niet gebruiken)
# GPIO38  Backlight, actief hoog                  (ledc)
# GPIO41  LCD_MOSI / RGB_D1                       (spi mosi_pin)
# GPIO43/44  UART0 TX/RX, downloadpoort en log    (niet gebruiken)
# GPIO47  LCD_SCLK / RGB_D0                       (spi clk_pin)
# EN      LCD_RST                                 (scherm-model)
#
# Strapping-pins: GPIO0, 3, 45, 46. Niet tijdens het opstarten
# tegen de standaardstand in vasthouden.
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# 3. HARDWARE
# ---------------------------------------------------------------------
spi:                              # alleen voor het scherm
  clk_pin:
    number: 47
    allow_other_uses: true        # pin wordt ook door de RGB-bus gebruikt
  mosi_pin:
    number: 41
    allow_other_uses: true

i2c:                              # BME680
  sda: GPIO2
  scl: GPIO1

output:
  - platform: ledc                # PWM voor de backlight
    id: display_led
    pin: 38
    zero_means_zero: true

light:
  - platform: monochromatic       # backlight van het scherm
    id: backlight
    output: display_led
    name: Backlight
    icon: mdi:brightness-percent
    default_transition_length: 500ms
    restore_mode: ALWAYS_ON

  - platform: esp32_rmt_led_strip # ledring (XT1063, GPIO4)
    pin: GPIO4
    num_leds: 13
    channel_colors: GRB
    chipset: WS2812
    id: status_leds
    name: "Status LEDs"
    default_transition_length: 300ms
    effects:
      - addressable_lambda:       # TIJDELIJKE TEST: elke led een eigen kleur, om de volgorde van de ring te bepalen
          name: "LED test"
          update_interval: 1s
          lambda: |-
            // index 0..12: rood, oranje, geel, lichtgroen, groen, turkoois, cyaan, azuurblauw, blauw, paars, magenta, roze, wit
            static const uint32_t kleur[13] = {
              0xFF0000, 0xFF8000, 0xFFFF00, 0x80FF00, 0x00FF00, 0x00FF80, 0x00FFFF,
              0x0080FF, 0x0000FF, 0x8000FF, 0xFF00FF, 0xFF0080, 0xFFFFFF };
            for (int i = 0; i < it.size() && i < 13; i++)
              it[i] = Color((kleur[i] >> 16) & 0xFF, (kleur[i] >> 8) & 0xFF, kleur[i] & 0xFF);

display:
  - platform: mipi_rgb
    model: zx2d10ge01r-v4848

binary_sensor:
  - platform: gpio                # drukknop op de draaiknop
    id: encoder_button
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    on_click:
      # Korte druk: scherm wisselen (of in de koppelpagina: keuze bevestigen)
      - min_length: 20ms
        max_length: 800ms
        then:
          - if:
              condition:
                light.is_off: backlight          # scherm is donker: alleen wakker maken
              then:
                - script.execute: reset_backlight_timer
              else:
                - script.execute: reset_backlight_timer
                - script.execute: button_short
      # Lange druk (langer dan 0,8 s): de koppelpagina openen
      - min_length: 800ms
        max_length: 10s
        then:
          - script.execute: reset_backlight_timer
          - script.execute: show_pair

  # --- Status van OpenAmber: binary sensors die rechtstreeks via packet_transport binnenkomen ---
  # Elke regel zegt waar de waarde op OpenAmber vandaan komt (bron-id staat tussen haakjes).
  # remote_id is de naam waaronder OpenAmber hem verstuurt (broadcast_id in packet_transport.yaml).
  - platform: packet_transport
    provider: openamber
    id: remote_twa
    remote_id: twa                # bron: switch "Tapwater aanwezig" (dhw_enabled_switch)
    filters:                    # alleen waarden van de gekoppelde OpenAmber (zelfde koppelcode)
      - lambda: 'if (id(pin_ok)) return x; return {};'
    name: "Tapwater Aanwezig"
    internal: false
    on_state:
      then:
        - script.execute: update_status_icons

  - platform: packet_transport
    provider: openamber
    id: remote_err
    remote_id: err                # bron: binary sensor "Error actief" (error_active)
    filters:                    # alleen waarden van de gekoppelde OpenAmber (zelfde koppelcode)
      - lambda: 'if (id(pin_ok)) return x; return {};'
    name: "Error Actief"
    device_class: problem
    internal: false
    on_state:
      then:
        - script.execute: update_status_icons

  - platform: packet_transport
    provider: openamber
    id: remote_warn
    remote_id: warn               # bron: binary sensor "Waarschuwing actief" (warning_active)
    filters:                    # alleen waarden van de gekoppelde OpenAmber (zelfde koppelcode)
      - lambda: 'if (id(pin_ok)) return x; return {};'
    name: "Waarschuwing Actief"
    device_class: problem
    internal: false
    on_state:
      then:
        - script.execute: update_status_icons

  - platform: packet_transport
    provider: openamber
    id: remote_legp
    remote_id: legp               # bron: switch "Legionellapreventie" (legio_enabled_switch)
    filters:                    # alleen waarden van de gekoppelde OpenAmber (zelfde koppelcode)
      - lambda: 'if (id(pin_ok)) return x; return {};'
    name: "Legionellapreventie Actief"
    internal: false

  - platform: packet_transport
    provider: openamber
    id: remote_wv
    remote_id: wv                 # bron: binary sensor "Warmtevraag" (heat_demand_active_sensor)
    filters:                    # alleen waarden van de gekoppelde OpenAmber (zelfde koppelcode)
      - lambda: 'if (id(pin_ok)) return x; return {};'
    name: "Warmtevraag"
    device_class: running
    internal: false
    on_state:
      then:
        - script.execute: update_status_icons

  - platform: packet_transport
    provider: openamber
    id: remote_twp
    remote_id: twp                # bron: binary sensor "Tapwater pomp" (dhw_pump_active_sensor)
    filters:                    # alleen waarden van de gekoppelde OpenAmber (zelfde koppelcode)
      - lambda: 'if (id(pin_ok)) return x; return {};'
    name: "Tapwater Pomp"
    device_class: running
    internal: false
    on_state:
      then:
        - script.execute: update_status_icons

  - platform: packet_transport
    provider: openamber
    id: remote_twv
    remote_id: twv                # bron: binary sensor "Tapwater vraag" (dhw_demand_active_sensor)
    filters:                    # alleen waarden van de gekoppelde OpenAmber (zelfde koppelcode)
      - lambda: 'if (id(pin_ok)) return x; return {};'
    name: "Tapwater Vraag"
    device_class: running
    internal: false
    on_state:
      then:
        - script.execute: update_status_icons

  - platform: packet_transport
    provider: openamber
    id: remote_lega
    remote_id: lega               # bron: binary sensor "Legionellacyclus actief" (dhw_legionella_run_active_sensor)
    filters:                    # alleen waarden van de gekoppelde OpenAmber (zelfde koppelcode)
      - lambda: 'if (id(pin_ok)) return x; return {};'
    name: "Legionellacyclus Actief"
    device_class: running
    internal: false
    on_state:
      then:
        - script.execute: update_status_icons

  - platform: packet_transport
    provider: openamber
    id: remote_cd
    remote_id: cd                 # bron: binary sensor "Koudevraag" (cool_demand_active_sensor)
    filters:                    # alleen waarden van de gekoppelde OpenAmber (zelfde koppelcode)
      - lambda: 'if (id(pin_ok)) return x; return {};'
    name: "Koudevraag"
    device_class: running
    internal: false
    on_state:
      then:
        - script.execute: update_status_icons

  - platform: packet_transport
    provider: openamber
    id: remote_da
    remote_id: da                 # bron: tapwater is bezig (dhw_active, intern in OpenAmber)
    filters:                    # alleen waarden van de gekoppelde OpenAmber (zelfde koppelcode)
      - lambda: 'if (id(pin_ok)) return x; return {};'
    name: "Tapwater Bezig"
    device_class: running
    internal: false
    on_state:
      then:
        - script.execute: update_status_icons

# ---------------------------------------------------------------------
# 4. SENSOREN
# ---------------------------------------------------------------------
sensor:
  # --- Koppelcode ---
  # De code van OpenAmber (laatste 6 hex-tekens van zijn MAC) komt als eerste waarde in elk pakket binnen.
  # Is hij gelijk aan de eigen code, dan worden de waarden hieronder gebruikt, anders genegeerd.
  # Alle OpenAmbers in de buurt worden bijgehouden voor de lijst op de koppelpagina.
  - platform: packet_transport
    provider: openamber
    id: remote_pin
    remote_id: pin
    internal: true
    on_value:
      then:
        - lambda: |-
            int c = (int) lroundf(x);
            if (c <= 0) return;
            uint32_t now = millis();
            for (size_t i = 0; i < id(found_codes).size(); i++) {
              if (id(found_codes)[i] == c) { id(found_seen)[i] = now; return; }
            }
            if (id(found_codes).size() < 8) {          // maximaal 8 codes onthouden
              id(found_codes).push_back(c);
              id(found_seen).push_back(now);
            }
        - script.execute: pin_check

  # Eigen koppelcode (de gekozen OpenAmber), wordt als eerste waarde in elk pakket verstuurd
  - platform: template
    id: pin_out
    internal: true
    update_interval: 10s
    lambda: |-
      // Ingetypte code (6 hex-tekens) omzetten naar een getal; ongeldig of leeg wordt 0
      std::string t = id(pair_code).state;
      if (t.size() != 6) return 0.0f;
      char *end = nullptr;
      long v = strtol(t.c_str(), &end, 16);
      return (*end == 0) ? (float) v : 0.0f;

  # --- Draaiknop (Hall-encoder) ---
  # Elke klik roept knob_step aan; wat er verandert hangt af van knob_context (zie sectie 6).
  - platform: rotary_encoder
    id: knob
    internal: false
    pin_a:
      number: GPIO6
      inverted: true
      mode: INPUT
    pin_b:
      number: GPIO5
      inverted: true
      mode: INPUT
    on_clockwise:
      - script.execute:
          id: knob_step
          delta: 1
    on_anticlockwise:
      - script.execute:
          id: knob_step
          delta: -1

  # --- BME680 (eigen meting in de kamer) ---
  # Let op: het verwarmingselement en de ledring maken de temperatuur te hoog;
  # vergelijk met een thermometer en corrigeer met "filters: - offset: -X".
  - platform: bme680
    address: 0x77                 # bevestigd door de I2C-scan
    update_interval: 15s
    temperature:
      id: bme_temp
      name: "Kamertemperatuur"
      internal: false
      on_value:
        then:
          # Overview: kamertemperatuur
          - lvgl.label.update:
              id: overview_label_roomtemp
              text: !lambda |-
                if (std::isnan(x)) return std::string("--");
                std::string s = str_sprintf("%.1f˚C", x);
                for (char &c : s) if (c == '.') c = ',';
                return s;
    humidity:
      id: bme_hum
      name: "Luchtvochtigheid"
      internal: false
    pressure:
      id: bme_pres
      name: "Luchtdruk"
      internal: false
    gas_resistance:
      id: bme_gas
      name: "Gasweerstand"
      internal: false

  # Dauwpunt, berekend uit temperatuur en luchtvochtigheid (Magnus-formule)
  - platform: template
    id: bme_dewpoint
    name: "Dauwpunt"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    internal: false
    lambda: |-
      float t = id(bme_temp).state;
      float rh = id(bme_hum).state;
      // Nog geen geldige meting? Dan ook geen dauwpunt.
      if (std::isnan(t) || std::isnan(rh) || rh <= 0) return NAN;
      const float b = 17.62, c = 243.12;
      float g = logf(rh / 100.0f) + (b * t) / (c + t);
      return (c * g) / (b - g);

  # Commando naar OpenAmber: volgnummer, modus en setpoints in een getal
  #   cmd = ((volgnr * 4 + modus) * 100 + laag*2) * 100 + hoog*2   (modus 3 = ongewijzigd)
  # Blijft leeg (NaN) tot de gebruiker iets verandert, zodat een herstart
  # geen oud commando herhaalt. Wordt gevuld door het script send_command.
  - platform: template
    id: cmd
    name: "Commando naar OpenAmber"
    internal: false
    update_interval: never

  # --- Temperaturen van OpenAmber (provider: openamber) ---
  # remote_id is de naam waaronder OpenAmber de waarde verstuurt (broadcast_id in packet_transport.yaml).
  # Op OpenAmber zijn dit de modbus-sensors met dezelfde naam als hier (bron-id staat bij elke sensor).
  - platform: packet_transport
    provider: openamber
    id: dhw_temperature_tw_sensor
    remote_id: tw               # bron op OpenAmber: dhw_temperature_tw_sensor
    filters:                    # alleen waarden van de gekoppelde OpenAmber (zelfde koppelcode)
      - lambda: 'if (id(pin_ok)) return x; return NAN;'
    name: "OpenAmber Tapwatertemperatuur (Tw)"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    internal: false
    on_value:
      then:
        - lvgl.label.update:
            id: overview_label_tw
            text: !lambda |-
              if (std::isnan(x)) return std::string("--");
              std::string s = str_sprintf("%.1f˚C", x);
              for (char &c : s) if (c == '.') c = ',';
              return s;

  - platform: packet_transport
    provider: openamber
    id: heat_cool_temperature_tc
    remote_id: tc               # bron op OpenAmber: heat_cool_temperature_tc
    filters:                    # alleen waarden van de gekoppelde OpenAmber (zelfde koppelcode)
      - lambda: 'if (id(pin_ok)) return x; return NAN;'
    name: "OpenAmber CV-aanvoertemperatuur (Tc)"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    internal: false

  - platform: packet_transport
    provider: openamber
    id: outlet_temperature_tuo
    remote_id: tuo               # bron op OpenAmber: outlet_temperature_tuo
    filters:                    # alleen waarden van de gekoppelde OpenAmber (zelfde koppelcode)
      - lambda: 'if (id(pin_ok)) return x; return NAN;'
    name: "OpenAmber CV-aanvoertemperatuur (Tuo)"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    internal: false

  - platform: packet_transport
    provider: openamber
    id: inlet_temperature_tui
    remote_id: tui               # bron op OpenAmber: inlet_temperature_tui
    filters:                    # alleen waarden van de gekoppelde OpenAmber (zelfde koppelcode)
      - lambda: 'if (id(pin_ok)) return x; return NAN;'
    name: "OpenAmber CV-retourtemperatuur (Tui)"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    internal: false

  - platform: packet_transport
    provider: openamber
    id: temperature_outside_ta
    remote_id: ta               # bron op OpenAmber: temperature_outside_ta
    filters:                    # alleen waarden van de gekoppelde OpenAmber (zelfde koppelcode)
      - lambda: 'if (id(pin_ok)) return x; return NAN;'
    name: "OpenAmber Buitentemperatuur (Ta)"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    internal: false

  - platform: packet_transport
    provider: openamber
    id: room_temperature
    remote_id: rt               # bron op OpenAmber: room_temperature
    filters:                    # alleen waarden van de gekoppelde OpenAmber (zelfde koppelcode)
      - lambda: 'if (id(pin_ok)) return x; return NAN;'
    name: "OpenAmber Ruimtetemperatuur (Tr)"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    internal: false

  # --- Werkelijke setpoints en modus van OpenAmber ---
  # Bron op OpenAmber: de thermostaat "Amber thermostat" (climate_controller). Een climate kan niet rechtstreeks
  # gedeeld worden, daarom staan er op OpenAmber drie kleine template-sensors (pt_target_low, pt_target_high,
  # pt_mode) die de waarden uit de climate lezen.
  # Alleen overnemen als de gebruiker niet zelf aan de knop draait.
  - platform: packet_transport
    provider: openamber
    id: rx_slo
    remote_id: slo                # bron: climate_controller, laag setpoint (pt_target_low)
    filters:                    # alleen waarden van de gekoppelde OpenAmber (zelfde koppelcode)
      - lambda: 'if (id(pin_ok)) return x; return NAN;'
    internal: false
    on_value:
      then:
        - lambda: |-
            if (!id(user_is_adjusting) && !std::isnan(x)) id(target_low).publish_state(x);

  - platform: packet_transport
    provider: openamber
    id: rx_shi
    remote_id: shi                # bron: climate_controller, hoog setpoint (pt_target_high)
    filters:                    # alleen waarden van de gekoppelde OpenAmber (zelfde koppelcode)
      - lambda: 'if (id(pin_ok)) return x; return NAN;'
    internal: false
    on_value:
      then:
        - lambda: |-
            if (!id(user_is_adjusting) && !std::isnan(x)) id(target_high).publish_state(x);

  - platform: packet_transport
    provider: openamber
    id: rx_mode
    remote_id: mode               # bron: climate_controller, modus 0=uit 1=verwarmen 2=koelen (pt_mode)
    filters:                    # alleen waarden van de gekoppelde OpenAmber (zelfde koppelcode)
      - lambda: 'if (id(pin_ok)) return x; return NAN;'
    internal: false
    on_value:
      then:
        - lambda: |-
            if (id(user_is_adjusting) || std::isnan(x)) return;
            int m = (int) lroundf(x);
            if (m == 1)      id(hp_mode).publish_state("Verwarmen");
            else if (m == 2) id(hp_mode).publish_state("Koelen");
            else             id(hp_mode).publish_state("Uit");
        - script.execute: update_status_icons

# ---------------------------------------------------------------------
# 5. BEDIENING (setpoints en modus)
# ---------------------------------------------------------------------
text:
  - platform: template            # code van de OpenAmber waarmee deze thermostaat praat
    id: pair_code
    name: "Koppelcode OpenAmber"
    # Wordt gevuld via de koppelpagina op de thermostaat; handmatig kan ook:
    # de laatste 6 tekens van het MAC-adres van OpenAmber (WiFi-pagina), bijvoorbeeld 112233
    mode: text
    min_length: 0
    max_length: 6
    initial_value: ""
    optimistic: true
    restore_value: true           # blijft bewaard na herstart en update
    entity_category: config
    on_value:
      then:
        - script.execute: pin_check
        - component.update: pin_out

number:
  - platform: template            # setpoint verwarmen
    id: target_low
    name: "Setpoint laag"
    min_value: 15
    max_value: 25
    step: 0.5
    initial_value: 20.5
    optimistic: true
    unit_of_measurement: "°C"
    device_class: temperature
    on_value:
      then:
        # Boog en label tonen het setpoint van de gekozen modus
        - script.execute: refresh_setpoint_ui
        # Versturen gebeurt bewust vanuit de draaiknop, niet hier: anders
        # zou elke binnenkomende waarde van OpenAmber weer een commando geven.

  - platform: template            # setpoint koelen (met de knop te bedienen als de modus Koelen is)
    id: target_high
    name: "Setpoint hoog"
    min_value: 18                 # gelijk aan thermostat_default_cool_setpoint in OpenAmber
    max_value: 30
    step: 0.5
    initial_value: 24.0
    optimistic: true
    unit_of_measurement: "°C"
    device_class: temperature
    set_action:
      - script.execute: send_command
    on_value:
      then:
        - script.execute: refresh_setpoint_ui

select:
  - platform: template            # modus van de warmtepomp
    id: hp_mode
    name: "Modus"
    options: ["Uit", "Verwarmen", "Koelen"]
    initial_option: "Uit"
    optimistic: true
    set_action:
      - globals.set:
          id: user_is_adjusting
          value: 'true'
      # Alleen bij een moduskeuze gaat de modus mee in het commando
      - lambda: |-
          id(pending_mode) = (x == "Verwarmen") ? 1 : (x == "Koelen") ? 2 : 0;
      - script.execute: send_command
      - script.execute: release_adjusting
    on_value:
      then:
        # Houd de modus als getal bij; send_command leest die
        - lambda: |-
            id(mode_code) = (x == "Verwarmen") ? 1 : (x == "Koelen") ? 2 : 0;
        # Boog en label tonen bij Koelen het hoge en anders het lage setpoint
        - script.execute: refresh_setpoint_ui

# --- Klok (via internet, SNTP); op dit moment staat er geen klok op het scherm ---
time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Amsterdam"

# ---------------------------------------------------------------------
# 6. SCRIPTS
# ---------------------------------------------------------------------
script:
  # Vergelijkt de code van OpenAmber met de eigen (ingetypte of gekozen) code
  - id: pin_check
    then:
      - lambda: |-
          // Ingetypte code (6 hex-tekens) omzetten naar een getal; ongeldig of leeg wordt 0
          std::string t = id(pair_code).state;
          char *end = nullptr;
          long mine = (t.size() == 6) ? strtol(t.c_str(), &end, 16) : 0;
          if (end != nullptr && *end != 0) mine = 0;
          id(pin_ok) = mine > 0 && id(remote_pin).has_state() &&
                       lroundf(id(remote_pin).state) == mine;

  # Korte druk op de knop: op de koppelpagina bevestigen, anders tussen Home en Overview wisselen

  - id: button_short
    then:
      - if:
          condition:
            lambda: 'return id(knob_context) == 3;'
          then:
            - script.execute: pair_confirm
          else:
            - script.execute: toggle_overview

  # Koppelpagina openen; de knop kiest dan uit de lijst

  - id: send_command
    mode: restart
    then:
      - delay: 600ms
      - lambda: |-
          // Nieuw volgnummer 1-99; OpenAmber voert elk volgnummer maar een keer uit
          id(cmd_seq) = id(cmd_seq) % 99 + 1;
          int lo2 = (int) lroundf(id(target_low).state * 2.0f);
          int hi2 = (int) lroundf(id(target_high).state * 2.0f);
          // Modus: 0 uit, 1 verwarmen, 2 koelen, 3 = ongewijzigd laten (alleen setpoints)
          int mode = id(pending_mode);
          id(pending_mode) = 3;
          float v = ((id(cmd_seq) * 4 + mode) * 100 + lo2) * 100 + hi2;
          id(cmd).publish_state(v);
          ESP_LOGI("cmd", "Verstuurd: volgnr %d, modus %d, %.1f - %.1f (waarde %.0f)",
                   id(cmd_seq), mode, id(target_low).state, id(target_high).state, v);

  # Zet de vlag "gebruiker draait" 3 s na de laatste klik weer uit.
  # Zolang de vlag aan staat, negeren we setpoints en modus die OpenAmber terugstuurt.

  - id: release_adjusting
    mode: restart
    then:
      - delay: 3s
      - globals.set:
          id: user_is_adjusting
          value: 'false'

  # Scherm en ledring 60 s aan na bediening of start

  - id: reset_backlight_timer
    mode: restart
    then:
      - light.turn_on:
          id: backlight
          brightness: 100%
      - light.turn_on:
          id: status_leds
          brightness: 100%
          red: 100%
          green: 50%
          blue: 10%               # warm oranje
      - delay: 60s
      - light.turn_off:
          id: backlight
          transition_length: 1s
      - light.turn_off:
          id: status_leds
          transition_length: 1s


  # Boog en labels bijwerken met het setpoint van de gekozen modus
  # (koelen: hoog setpoint, anders laag setpoint). De boog loopt van 0 tot 100 en toont
  # waar het setpoint binnen het bereik van de modus ligt:
  #   verwarmen 15-25 graden (target_low), koelen 18-30 graden (target_high).

  - id: toggle_overview
    then:
      - if:
          condition:
            lambda: 'return id(knob_context) == 0;'
          then:
            - script.execute: show_overview
          else:
            - script.execute: show_home

  # Wordt bij elke klik van de draaiknop aangeroepen; delta is +1 (rechtsom) of -1 (linksom)

# ---------------------------------------------------------------------
# 7. ESP-NOW (packet_transport)
# ---------------------------------------------------------------------
# Zet in secrets.yaml (van dit project en van OpenAmber) dezelfde regel:
#   espnow_key: "een-eigen-lange-willekeurige-tekst"
espnow:
  id: openamber_thermostat
  auto_add_peer: true           # onbekende afzenders worden vanzelf toegevoegd; zonder de sleutel wordt er niets mee gedaan

packet_transport:
  - platform: espnow
    id: transport_broadcast
    espnow_id: openamber_thermostat
    # Geen peer_address: de pakketten gaan als broadcast. De versleuteling zorgt dat alleen
    # een apparaat met dezelfde sleutel iets met de pakketten kan.
    encryption: !secret espnow_key
    # Rolling code staat uit (zie eerdere problemen rond herstarts).
    # rolling_code_enable: true
    providers:
      - name: openamber           # moet gelijk zijn aan "esphome: name:" van OpenAmber
        encryption: !secret espnow_key   # nodig om de pakketten van OpenAmber te kunnen lezen
    sensors:
      - id: pin_out               # koppelcode: altijd als eerste, zodat de ontvanger hem eerst kent
        broadcast_id: pin
      - id: bme_temp
        broadcast_id: bt
      - id: bme_hum
        broadcast_id: bh
      - id: bme_dewpoint
        broadcast_id: dp
      - id: cmd
        broadcast_id: cmd

# Elke 2 s de lijst op de koppelpagina bijwerken, maar alleen zolang die pagina open is
interval:
  - interval: 2s
    then:
      - if:
          condition:
            lambda: 'return id(knob_context) == 3;'
          then:
            - script.execute: pair_refresh

# ---------------------------------------------------------------------
# 8. SCHERM (LVGL)
# De pagina's, lettertypen en kleuren komen uit de LVGL Designer en staan in
# thermostat/ui_designer.yaml; de scripts die het scherm bedienen in
# thermostat/ui_scripts.yaml. Beide worden hier samengevoegd.
# ---------------------------------------------------------------------
packages:
  ui_designer: !include thermostat/ui_designer.yaml
  ui_scripts: !include thermostat/ui_scripts.yaml

lvgl:
  buffer_size: 25%   # handmatig; staat hier zodat een nieuwe Designer-export het niet overschrijft
