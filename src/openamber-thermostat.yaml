                  text: "\U000F0393"
                  text_font: mdi_icons_40
                  text_align: CENTER
                  text_color: 0x000000
              - label:
                  id: overview_icon_tw
                  x: 139
                  y: 177
                  width: 40
                  height: 40
                  text: "\U000F1B29"
                  text_font: mdi_icons_40
                  text_align: CENTER
                  text_color: 0x242424
              - label:
                  id: overview_label_tw
                  x: 186
