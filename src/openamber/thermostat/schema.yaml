script:
  # Bepaalt welke periode nu geldt en zet het setpoint als die periode nieuw is
  - id: schema_toepassen
    then:
      - lambda: |-
          if (!id(schema_actief).state) return;
          // Tijd: eigen klok als die klopt, anders de tijd van OpenAmber (telt zelf door tussen twee berichten)
          int d, m;
          auto nu = id(sntp_time).now();
          if (nu.is_valid()) {
            d = (nu.day_of_week + 5) % 7;   // dag_of_week: 1 = zondag; wij tellen 0 = maandag
            m = nu.hour * 60 + nu.minute;
          } else if (id(klok_ref_min) >= 0) {
            int tot = (id(klok_ref_min) + (int) ((millis() - id(klok_ref_ms)) / 60000UL)) % 10080;
            d = tot / 1440;
            m = tot % 1440;
          } else {
            return;
          }
          esphome::datetime::TimeEntity *dag_start[7] = {id(schema_ma_dag_start),id(schema_di_dag_start),id(schema_wo_dag_start),id(schema_do_dag_start),id(schema_vr_dag_start),id(schema_za_dag_start),id(schema_zo_dag_start)};
          esphome::datetime::TimeEntity *nacht_start[7] = {id(schema_ma_nacht_start),id(schema_di_nacht_start),id(schema_wo_nacht_start),id(schema_do_nacht_start),id(schema_vr_nacht_start),id(schema_za_nacht_start),id(schema_zo_nacht_start)};
          float dag_temp[7] = {id(schema_ma_dag_temp).state,id(schema_di_dag_temp).state,id(schema_wo_dag_temp).state,id(schema_do_dag_temp).state,id(schema_vr_dag_temp).state,id(schema_za_dag_temp).state,id(schema_zo_dag_temp).state};
          float nacht_temp[7] = {id(schema_ma_nacht_temp).state,id(schema_di_nacht_temp).state,id(schema_wo_nacht_temp).state,id(schema_do_nacht_temp).state,id(schema_vr_nacht_temp).state,id(schema_za_nacht_temp).state,id(schema_zo_nacht_temp).state};
          int ds = dag_start[d]->hour * 60 + dag_start[d]->minute;
          int ns = nacht_start[d]->hour * 60 + nacht_start[d]->minute;
          int periode;
          float temp;
          if (m < ds) {                 // nacht van gisteren, loopt door tot begin van de dag
            int g = (d + 6) % 7;
            periode = g * 2 + 1;  temp = nacht_temp[g];
          } else if (m < ns || ns <= ds) {   // overdag (ns <= ds: nacht ligt voor de dag, dan geldt de dag de rest van de dag)
            periode = d * 2;  temp = dag_temp[d];
          } else {
            periode = d * 2 + 1;  temp = nacht_temp[d];
          }
          if (periode == id(schema_periode)) return;
          id(schema_periode) = periode;
          if (id(mode_code) != 1) return;    // alleen bij verwarmen
          ESP_LOGI("schema", "Periode %d, setpoint %.1f", periode, temp);
          id(user_is_adjusting) = true;
          id(target_low).make_call().set_value(temp).perform();
          id(send_command).execute();
          id(release_adjusting).execute();

interval:
  - interval: 30s
    then:
      - script.execute: schema_toepassen
