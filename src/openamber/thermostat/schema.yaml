# =====================================================================
# Schema voor nachtverlaging, per dag instelbaar (gegenereerd; bewerk gerust met de hand)
#
# Per weekdag vier instellingen: begin van de dag, begin van de nacht, temperatuur overdag en
# temperatuur 's nachts. De nacht van een dag loopt door tot de begintijd van de volgende dag.
# Voorbeeld: dag 07:00-21:00 op 20,5 en nacht 21:00-07:00 op 19,5.
#
# Werking:
#  - Alleen als "Schema actief" aan staat en de modus Verwarmen is.
#  - Op het moment dat een periode begint (of bij opstarten) wordt het setpoint van die periode
#    gezet en naar OpenAmber gestuurd. Draai je daarna aan de knop, dan blijft jouw waarde staan
#    tot de volgende omschakeling.
#  - Tijd: eigen internetklok (SNTP) als de thermostaat WiFi heeft, anders de tijd die OpenAmber
#    meestuurt (kanaal tm, minuten sinds maandag 00:00). Zonder tijd gebeurt er niets.
#  - Instellen kan via Home Assistant (entiteiten met categorie Configuratie).
# =====================================================================
globals:
  - id: schema_periode            # laatst toegepaste periode (dag*2 + 0 voor dag / 1 voor nacht), -1 = nog geen
    type: int
    initial_value: '-1'

  - id: klok_ref_min              # laatst ontvangen tijd van OpenAmber: minuten sinds maandag 00:00, -1 = nog niet
    type: int
    initial_value: '-1'
  - id: klok_ref_ms               # millis() op het moment van ontvangst
    type: uint32_t
    initial_value: '0'

sensor:
  - platform: packet_transport    # tijd van OpenAmber (bron: thermostat_link.yaml, sensor pt_tijd)
    provider: openamber
    id: rx_tm
    remote_id: tm
    internal: true
    filters:
      - lambda: 'if (id(pin_ok)) return x; return NAN;'
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) return;
            id(klok_ref_min) = (int) lroundf(x);
            id(klok_ref_ms) = millis();

switch:
  - platform: template
    id: schema_actief
    name: "Schema actief"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - lambda: 'id(schema_periode) = -1;'
      - script.execute: schema_toepassen

