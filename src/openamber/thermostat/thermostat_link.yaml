# =====================================================================
# Thermostaat-koppeling via ESP-NOW (packet_transport) voor OpenAmber
#
# Optioneel pakket: aan de originele OpenAmber-bestanden verandert niets.
# Zet dit bestand in:  src/openamber/optional/thermostat_link.yaml
# en neem het op via een eigen apparaatbestand
# (zie openamber-waveshare-display-espnow.yaml).
#
# Er is geen MAC-adres nodig. De koppeling werkt met broadcast en een gedeelde
# sleutel: pakketten worden versleuteld, en alleen een apparaat met dezelfde
# sleutel wordt begrepen. De thermostaat en OpenAmber vinden elkaar dus vanzelf.
#
# Het apparaatbestand moet deze substitution zetten:
#   thermostat_link_key: !secret espnow_key    # dezelfde tekst in secrets.yaml van de thermostaat
# En mag deze overschrijven (standaard hieronder):
#   thermostat_name: "openamber-thermostaat"   # "esphome: name:" van de thermostaat
#
# Let op:
#  - Commando's van de thermostaat hebben alleen effect op de warmtepomp als
#    "Thermostaat keuze" in OpenAmber op "Intern" staat (standaard is "Extern").
#  - Alleen voor builds met scherm: rx_cmd roept update_thermostat_settings_ui
#    aan, dat alleen in de UI bestaat. Voor een build zonder scherm (leejow)
#    haal je die ene regel weg.
#
# Opbouw: 1. Algemeen  2. Wat OpenAmber verstuurt  3. Wat de thermostaat verstuurt
# =====================================================================

substitutions:
  thermostat_name: openamber-thermostaat

# ---------------------------------------------------------------------
# 1. ALGEMEEN
# ---------------------------------------------------------------------
globals:
  - id: thermostat_pin_ok         # true als de koppelcode van de thermostaat gelijk is aan de eigen koppelcode
    type: bool
    initial_value: 'false'
  - id: last_cmd_seq              # volgnummer van het laatst uitgevoerde commando
    type: int
    restore_value: yes            # blijft bewaard na een herstart, zodat niets opnieuw wordt uitgevoerd
    initial_value: '-1'

espnow:
  id: espnow_component
  auto_add_peer: true             # onbekende afzenders worden vanzelf toegevoegd; zonder de sleutel wordt er niets mee gedaan

packet_transport:
  - platform: espnow
    id: transport_thermostaat
    espnow_id: espnow_component
    # Geen peer_address: de pakketten gaan als broadcast. Versleuteling en rolling code
    # zorgen dat alleen een apparaat met dezelfde sleutel iets met de pakketten kan.
    encryption: ${thermostat_link_key}
    rolling_code_enable: false    # voorlopig uit; eerst moet de verbinding werken
    providers:
      - name: ${thermostat_name}
        encryption: ${thermostat_link_key}   # nodig om pakketten van de thermostaat te kunnen lezen

    # -------------------------------------------------------------
    # 2. WAT OPENAMBER VERSTUURT
    # Bij elke regel staat waar de waarde op gebaseerd is.
    # broadcast_id is de naam waaronder de thermostaat de waarde ontvangt.
    # -------------------------------------------------------------
    sensors:
      # Koppelcode: altijd als eerste, zodat de thermostaat hem eerst kent
      - id: pt_pin
        broadcast_id: pin
      # Temperaturen: de bestaande modbus-sensors, rechtstreeks gedeeld
      - id: dhw_temperature_tw_sensor       # Tapwatertemperatuur (Tw)
        broadcast_id: tw
      - id: current_dhw_setpoint_sensor     # doeltemperatuur tapwater (voor de ledring)
        broadcast_id: tws
      - id: heat_cool_temperature_tc        # CV-aanvoertemperatuur (Tc)
        broadcast_id: tc
      - id: outlet_temperature_tuo          # CV-aanvoertemperatuur (Tuo)
        broadcast_id: tuo
      - id: inlet_temperature_tui           # CV-retourtemperatuur (Tui)
        broadcast_id: tui
      - id: temperature_outside_ta          # Buitentemperatuur (Ta)
        broadcast_id: ta
      - id: room_temperature                # Ruimtetemperatuur (Tr)
        broadcast_id: rt
      # Setpoints en modus uit de "Amber thermostat" (climate_controller),
      # via de template-sensors hieronder (een climate kan niet rechtstreeks gedeeld worden)
      - id: pt_target_low                   # laag setpoint (verwarmen)
        broadcast_id: slo
      - id: pt_target_high                  # hoog setpoint (koelen)
        broadcast_id: shi
      - id: pt_mode                         # modus: 0=uit 1=verwarmen 2=koelen
        broadcast_id: mode
      - id: current_compressor_frequency    # compressorfrequentie (Hz)
        broadcast_id: cf
      - id: pt_errcode                      # eerste actieve fout of waarschuwing als getal
        broadcast_id: ec
      - id: current_setpoint                # "Huidig setpoint": gewenste aanvoertemperatuur (stooklijn, handmatig of koelen)
        broadcast_id: wsp                   # de thermostaat gebruikt hem voor de kleuren van aanvoer en retour
      - id: pt_tijd                         # tijd: minuten sinds maandag 00:00 (voor het schema, ook zonder WiFi op de thermostaat)
        broadcast_id: tm

    binary_sensors:
      # Bestaande binary sensors, rechtstreeks gedeeld
      - id: error_active                    # "Error actief"
        broadcast_id: err
      - id: warning_active                  # "Waarschuwing actief"
        broadcast_id: warn
      - id: heat_demand_active_sensor       # "Warmtevraag"
        broadcast_id: wv
      - id: cool_demand_active_sensor       # "Koudevraag"
        broadcast_id: cd
      - id: dhw_pump_active_sensor          # "Tapwater pomp"
        broadcast_id: twp
      - id: dhw_demand_active_sensor        # "Tapwater vraag"
        broadcast_id: twv
      - id: dhw_active                      # tapwater is bezig (intern, zonder naam)
        broadcast_id: da
      - id: dhw_legionella_run_active_sensor  # "Legionellacyclus actief"
        broadcast_id: lega
      - id: defrost_active_sensor           # "Defrost" (ontdooicyclus actief)
        broadcast_id: dfr
      - id: backup_heater_active_sensor     # "Verwarmingselement" (backupelement aan)
        broadcast_id: bu
      # Binary sensors die een switch volgen (hieronder in binary_sensor:)
      - id: pt_twa                          # volgt de switch "Tapwater aanwezig"
        broadcast_id: twa
      - id: pt_legp                         # volgt de switch "Legionellapreventie"
        broadcast_id: legp

# Binary sensors die een switch alleen-lezen volgen, zodat die gedeeld kan worden
binary_sensor:
  - platform: switch
    id: pt_twa
    source_id: dhw_enabled_switch           # de switch "Tapwater aanwezig"
    internal: true
  - platform: switch
    id: pt_legp
    source_id: legio_enabled_switch         # de switch "Legionellapreventie"
    internal: true

script:
  - id: thermostat_pin_check      # vergelijkt de koppelcode van de thermostaat met de eigen code
    then:
      - lambda: |-
          // Eigen code = laatste 6 hex-tekens van het MAC-adres van OpenAmber (als getal)
          long mine = strtol(get_mac_address().substr(6).c_str(), nullptr, 16);
          id(thermostat_pin_ok) = mine > 0 && id(rx_pin).has_state() &&
                                  lroundf(id(rx_pin).state) == mine;

sensor:
  # Eigen koppelcode, wordt als eerste waarde in elk pakket verstuurd.
  # Dit zijn de laatste 6 hex-tekens van het MAC-adres van OpenAmber (zie ook de WiFi-pagina),
  # bijvoorbeeld MAC AA:BB:CC:11:22:33 geeft code 112233. Elk apparaat heeft zo een eigen code.
  # Dit getal past precies in een float (24 bits), dus er gaat niets verloren bij het versturen.
  - platform: template
    id: pt_pin
    internal: true
    update_interval: 5s
    lambda: 'return (float) strtol(get_mac_address().substr(6).c_str(), nullptr, 16);'

  # Tijd voor de thermostaat: minuten sinds maandag 00:00 (0 tot 10079), uit de klok my_time van OpenAmber.
  # Geen geldige tijd: NAN, dan negeert de thermostaat hem.
  - platform: template
    id: pt_tijd
    internal: true
    update_interval: 30s
    lambda: |-
      auto nu = id(my_time).now();
      if (!nu.is_valid()) return NAN;
      return (float) (((nu.day_of_week + 5) % 7) * 1440 + nu.hour * 60 + nu.minute);

  # Koppelcode van de thermostaat (de code die daar is ingetypt): moet gelijk zijn aan de eigen code
  - platform: packet_transport
    provider: ${thermostat_name}
    remote_id: pin
    id: rx_pin
    internal: true
    on_value:
      then:
        - script.execute: thermostat_pin_check

  # Setpoints en modus van de "Amber thermostat", elke 5 s uit de climate gelezen
  - platform: template
    id: pt_target_low
    internal: true
    update_interval: 5s
    lambda: 'return id(climate_controller).target_temperature_low;'

  - platform: template
    id: pt_target_high
    internal: true
    update_interval: 5s
    lambda: 'return id(climate_controller).target_temperature_high;'

  - platform: template
    id: pt_mode                             # 0 = uit, 1 = verwarmen, 2 = koelen
    internal: true
    update_interval: 5s
    lambda: |-
      auto m = id(climate_controller).mode;
      if (m == climate::CLIMATE_MODE_HEAT) return 1.0f;
      if (m == climate::CLIMATE_MODE_COOL) return 2.0f;
      return 0.0f;

  # Eerste actieve fout (daarna waarschuwing) als getal voor de thermostaat:
  # 1xx = P-code, 2xx = F-code, 3xx = E-code (P05 = 105, F14 = 214, E03 = 303),
  # 401-406 = overige fouten, 407-409 = overige waarschuwingen; 0 = niets aan de hand.
  - platform: template
    id: pt_errcode
    internal: true
    update_interval: 5s
    lambda: |-
      if (id(error_flag_p03).state) return 103.0f;
      if (id(error_flag_p05).state) return 105.0f;
      if (id(error_flag_p08).state) return 108.0f;
      if (id(error_flag_p09).state) return 109.0f;
      if (id(error_flag_p10).state) return 110.0f;
      if (id(error_flag_f01).state) return 201.0f;
      if (id(error_flag_f02).state) return 202.0f;
      if (id(error_flag_f03).state) return 203.0f;
      if (id(error_flag_f04).state) return 204.0f;
      if (id(error_flag_f05).state) return 205.0f;
      if (id(error_flag_f06).state) return 206.0f;
      if (id(error_flag_f07).state) return 207.0f;
      if (id(error_flag_f09).state) return 209.0f;
      if (id(error_flag_e01).state) return 301.0f;
      if (id(error_flag_e02).state) return 302.0f;
      if (id(error_flag_e03).state) return 303.0f;
      if (id(error_flag_e04).state) return 304.0f;
      if (id(error_flag_e05).state) return 305.0f;
      if (id(error_flag_e06).state) return 306.0f;
      if (id(error_flag_e07).state) return 307.0f;
      if (id(error_flag_e08).state) return 308.0f;
      if (id(error_flag_f10).state) return 210.0f;
      if (id(error_flag_f13).state) return 213.0f;
      if (id(error_flag_f14).state) return 214.0f;
      if (id(error_flag_f15).state) return 215.0f;
      if (id(error_flag_f16).state) return 216.0f;
      if (id(error_flag_f17).state) return 217.0f;
      if (id(error_flag_f18).state) return 218.0f;
      if (id(error_flag_f21).state) return 221.0f;
      if (id(error_flag_f22).state) return 222.0f;
      if (id(error_pump_start_timeout).state) return 401.0f;
      if (id(error_compressor_start_timeout).state) return 402.0f;
      if (id(error_pump_stop_timeout).state) return 403.0f;
      if (id(error_modbus_connection_timeout).state) return 404.0f;
      if (id(error_three_way_valve_state_timeout).state) return 405.0f;
      if (id(error_inside_unit_failsafe).state) return 406.0f;
      if (id(error_flag_p01).state) return 101.0f;
      if (id(error_flag_p02).state) return 102.0f;
      if (id(error_flag_p07).state) return 107.0f;
      if (id(error_flag_p06).state) return 106.0f;
      if (id(error_flag_p11).state) return 111.0f;
      if (id(error_flag_p12).state) return 112.0f;
      if (id(error_flag_p13).state) return 113.0f;
      if (id(error_flag_inside_comm_failsafe).state) return 407.0f;
      if (id(error_flag_inside_eeprom).state) return 408.0f;
      if (id(error_flag_pump_p0_alarm).state) return 409.0f;
      return 0.0f;

  # -------------------------------------------------------------
  # 3. WAT DE THERMOSTAAT VERSTUURT
  # -------------------------------------------------------------
  # BME680-waarden van de thermostaat, zichtbaar in de web-interface
  - platform: packet_transport
    provider: ${thermostat_name}
    filters:                                # alleen bij gelijke koppelcode
      - lambda: 'if (id(thermostat_pin_ok)) return x; return NAN;'
    remote_id: bt                           # temperatuur
    id: thermostat_temp
    name: "Thermostaat temperatuur (BME680)"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    internal: false
    web_server:
      sorting_group_id: temperature_sensors

  - platform: packet_transport
    provider: ${thermostat_name}
    filters:                                # alleen bij gelijke koppelcode
      - lambda: 'if (id(thermostat_pin_ok)) return x; return NAN;'
    remote_id: bh                           # luchtvochtigheid
    id: thermostat_hum
    name: "Thermostaat luchtvochtigheid (BME680)"
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 1
    internal: false
    web_server:
      sorting_group_id: temperature_sensors

  - platform: packet_transport
    provider: ${thermostat_name}
    filters:                                # alleen bij gelijke koppelcode
      - lambda: 'if (id(thermostat_pin_ok)) return x; return NAN;'
    remote_id: dp                           # dauwpunt (op de thermostaat berekend)
    id: thermostat_dewpoint
    name: "Thermostaat dauwpunt (BME680)"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    internal: false
    web_server:
      sorting_group_id: temperature_sensors

  # Commando van de thermostaat (setpoints en/of modus) in een getal:
  #   cmd = ((volgnr * 4 + modus) * 100 + laag*2) * 100 + hoog*2
  #   modus: 0 = uit, 1 = verwarmen, 2 = koelen, 3 = niet aanraken (alleen setpoints)
  # Wordt alleen uitgevoerd als het volgnummer anders is dan het laatst uitgevoerde;
  # het pakket wordt periodiek herhaald en levert dan dus geen nieuw commando op.
  - platform: packet_transport
    provider: ${thermostat_name}
    remote_id: cmd
    id: rx_cmd
    internal: true
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) return;
            // Alleen commando's van de gekoppelde thermostaat uitvoeren
            if (!id(thermostat_pin_ok)) return;
            // Pak het getal uit: hoog*2, laag*2, modus (0-3) en volgnummer
            long n = lroundf(x);
            int hi2 = n % 100;  n /= 100;
            int lo2 = n % 100;  n /= 100;
            int mode = n % 4;
            int seq = n / 4;
            // Zelfde volgnummer als de vorige keer: herhaald pakket, negeren
            if (seq == id(last_cmd_seq)) return;
            id(last_cmd_seq) = seq;
            float lo = lo2 / 2.0f;
            float hi = hi2 / 2.0f;
            auto call = id(climate_controller).make_call();
            // Setpoints alleen toepassen als ze redelijk zijn
            if (lo >= 5 && hi <= 35 && lo <= hi) {
              call.set_target_temperature_low(lo);
              call.set_target_temperature_high(hi);
            } else {
              ESP_LOGW("thermostat_link", "Setpoints genegeerd: %.1f - %.1f", lo, hi);
            }
            // Modus: 0 = uit, 1 = verwarmen, 2 = koelen, 3 = niet aanraken
            if (mode == 1)      call.set_mode(climate::CLIMATE_MODE_HEAT);
            else if (mode == 2) call.set_mode(climate::CLIMATE_MODE_COOL);
            else if (mode == 0) call.set_mode(climate::CLIMATE_MODE_OFF);
            call.perform();
            ESP_LOGI("thermostat_link", "Commando %d: modus %d, %.1f - %.1f", seq, mode, lo, hi);
            // Scherm van OpenAmber bijwerken (alleen in builds met scherm)
            id(update_thermostat_settings_ui).execute();
