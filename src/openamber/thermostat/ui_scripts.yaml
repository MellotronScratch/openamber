# =====================================================================
# Thermostaat - scripts die iets met het scherm doen (LVGL)
# Verwijzen naar widget-id's uit ui_designer.yaml: hernoem je een widget in de
# Designer, pas het dan ook hier aan.
# =====================================================================
script:
  - id: update_status_icons       # zet symbool, kleur en zichtbaarheid van de statusicoontjes op Overview
    mode: restart
    then:
      - lambda: |-
          auto on = [](binary_sensor::BinarySensor *b) { return b->has_state() && b->state; };
          // Verwarmen / koelen / standby (zelfde plek, ander symbool en kleur)
          if (on(id(remote_cd))) {
            lv_label_set_text(id(overview_icon_heatcool), "\U000F0717");               // sneeuwvlok
            lv_obj_set_style_text_color(id(overview_icon_heatcool), lv_color_hex(0x00A8FF), 0);
          } else if (on(id(remote_wv))) {
            lv_label_set_text(id(overview_icon_heatcool), "\U000F0238");               // vlam
            lv_obj_set_style_text_color(id(overview_icon_heatcool), lv_color_hex(0xFF6A00), 0);
          } else {
            lv_label_set_text(id(overview_icon_heatcool), "\U000F0238");               // vlam, grijs
            lv_obj_set_style_text_color(id(overview_icon_heatcool), lv_color_hex(0x808080), 0);
          }
          // Fout (rood) gaat voor waarschuwing (oranje); niets aan de hand = verborgen
          if (on(id(remote_err))) {
            lv_obj_set_style_text_color(id(overview_icon_errorwarning), lv_color_hex(0xFF0000), 0);
            lv_obj_clear_flag(id(overview_icon_errorwarning), LV_OBJ_FLAG_HIDDEN);
          } else if (on(id(remote_warn))) {
            lv_obj_set_style_text_color(id(overview_icon_errorwarning), lv_color_hex(0xFFA500), 0);
            lv_obj_clear_flag(id(overview_icon_errorwarning), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(overview_icon_errorwarning), LV_OBJ_FLAG_HIDDEN);
          }
          // Tapwater: alleen zichtbaar als aanwezig; blauw als tapwater bezig is, anders grijs
          if (on(id(remote_twa))) {
            bool bezig = on(id(remote_da)) || on(id(remote_twp)) || on(id(remote_twv));
            lv_obj_set_style_text_color(id(overview_icon_tw), lv_color_hex(bezig ? 0x00A8FF : 0x808080), 0);
            lv_obj_clear_flag(id(overview_icon_tw), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(overview_icon_tw), LV_OBJ_FLAG_HIDDEN);
          }
          // Legionellarun: bacterie alleen tijdens de run
          if (on(id(remote_twa)) && on(id(remote_lega))) {
            lv_obj_set_style_text_color(id(overview_icon_leg), lv_color_hex(0x2ECC71), 0);
            lv_obj_clear_flag(id(overview_icon_leg), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(overview_icon_leg), LV_OBJ_FLAG_HIDDEN);
          }

  - id: show_pair
    then:
      - globals.set:
          id: knob_context
          value: '3'
      - lvgl.page.show: canvas_11
      - script.execute: pair_refresh

  # Lijst met gevonden OpenAmbers bijwerken (elke 2 s zolang de koppelpagina open is)

  - id: pair_refresh
    mode: restart
    then:
      - lambda: |-
          // Codes die langer dan 30 s niet meer zijn gehoord, verdwijnen uit de lijst
          uint32_t now = millis();
          for (int i = (int) id(found_codes).size() - 1; i >= 0; i--) {
            if (now - id(found_seen)[i] > 30000) {
              id(found_codes).erase(id(found_codes).begin() + i);
              id(found_seen).erase(id(found_seen).begin() + i);
            }
          }
          // Opties voor de roller: elke gevonden code op een eigen regel, onderaan Annuleren
          std::string opts;
          for (int c : id(found_codes)) {
            char b[8];
            snprintf(b, sizeof(b), "%06X", c);
            opts += b;
            opts += "\n";
          }
          opts += "Annuleren";
          // Alleen bijwerken als de lijst verandert, anders springt de selectie steeds terug
          static std::string last;
          lv_obj_t *r = id(pair_roller)->obj;
          if (opts != last) {
            int n = (int) id(found_codes).size() + 1;
            int sel = (int) lv_roller_get_selected(r);
            lv_roller_set_options(r, opts.c_str(), LV_ROLLER_MODE_NORMAL);
            if (sel > n - 1) sel = n - 1;
            lv_roller_set_selected(r, sel, LV_ANIM_OFF);
            last = opts;
          }
          bool leeg = id(found_codes).empty();
          lv_label_set_text(id(pair_label_status), leeg ? "Zoeken naar OpenAmber..." : "Kies je OpenAmber");
          // Draaiend bolletje alleen zolang er nog niets is gevonden
          if (leeg) lv_obj_clear_flag(id(pair_spinner), LV_OBJ_FLAG_HIDDEN);
          else      lv_obj_add_flag(id(pair_spinner), LV_OBJ_FLAG_HIDDEN);

  # Keuze in de lijst bevestigen: code bewaren (of annuleren) en terug naar Home

  - id: pair_confirm
    then:
      - lambda: |-
          int sel = (int) lv_roller_get_selected(id(pair_roller)->obj);
          int n = (int) id(found_codes).size();
          if (sel >= 0 && sel < n) {                  // de laatste regel is Annuleren
            char b[8];
            snprintf(b, sizeof(b), "%06X", id(found_codes)[sel]);
            id(pair_code).make_call().set_value(b).perform();
          }
      - script.execute: show_home

  # Bouwt het commando (volgnummer + modus + setpoints) 600 ms na de laatste
  # draai-impuls of moduskeuze en publiceert het in de sensor "cmd".

  - id: refresh_setpoint_ui
    then:
      - lvgl.arc.update:
          id: thermostat_arc_setpoint
          value: !lambda |-
            bool koelen = (id(mode_code) == 2);
            float sp = koelen ? id(target_high).state : id(target_low).state;
            float min_sp = koelen ? 18.0f : 15.0f;
            float max_sp = koelen ? 30.0f : 25.0f;
            if (std::isnan(sp)) return 0;
            float pct = (sp - min_sp) / (max_sp - min_sp) * 100.0f;
            if (pct < 0) pct = 0;
            if (pct > 100) pct = 100;
            return (int) lroundf(pct);
      # Home: grote doeltemperatuur
      - lvgl.label.update:
          id: thermostat_label_setpoint
          text: !lambda |-
            float sp = (id(mode_code) == 2) ? id(target_high).state : id(target_low).state;
            if (std::isnan(sp)) return std::string("--");
            std::string s = str_sprintf("%.1f˚C", sp);
            for (char &c : s) if (c == '.') c = ',';
            return s;
      # Overview: doeltemperatuur
      - lvgl.label.update:
          id: overview_label_setpoint
          text: !lambda |-
            float sp = (id(mode_code) == 2) ? id(target_high).state : id(target_low).state;
            if (std::isnan(sp)) return std::string("--");
            std::string s = str_sprintf("%.1f˚C", sp);
            for (char &c : s) if (c == '.') c = ',';
            return s;

  # Pagina's wisselen en de draaiknop de bijbehorende context geven

  - id: show_home
    then:
      - globals.set:
          id: knob_context
          value: '0'
      - lvgl.page.show: canvas_2

  - id: show_overview
    then:
      - globals.set:
          id: knob_context
          value: '1'
      - lvgl.page.show: canvas_5

  # Klik op de knop: vanaf Home naar Overview, vanaf elk ander scherm terug naar Home

  - id: knob_step
    parameters:
      delta: int
    then:
      # Is het scherm donker (na de slaaptimer)? Dan alleen wakker maken, niets verstellen.
      - if:
          condition:
            light.is_off: backlight
          then:
            - script.execute: reset_backlight_timer
            - script.stop: knob_step
      - script.execute: reset_backlight_timer

      # Context 0 = Home: setpoint van de gekozen modus instellen
      # (koelen: hoog setpoint, anders laag setpoint, zoals het scherm van OpenAmber)
      - if:
          condition:
            lambda: 'return id(knob_context) == 0;'
          then:
            - globals.set:
                id: user_is_adjusting
                value: 'true'
            - if:
                condition:
                  lambda: 'return id(mode_code) == 2;'
                then:
                  - if:
                      condition:
                        lambda: 'return delta > 0;'
                      then:
                        - number.increment:
                            id: target_high
                            cycle: false
                      else:
                        - number.decrement:
                            id: target_high
                            cycle: false
                else:
                  - if:
                      condition:
                        lambda: 'return delta > 0;'
                      then:
                        - number.increment:
                            id: target_low
                            cycle: false
                      else:
                        - number.decrement:
                            id: target_low
                            cycle: false
            - script.execute: send_command
            - script.execute: release_adjusting

      # Context 1 = Overview: hier komt later de navigatie door het menu
      # (nu doet draaien hier niets)

      # Context 2 = modus kiezen (Uit / Verwarmen / Koelen); nog niet bereikbaar vanuit de GUI.
      # De keuze verstuurt zelf een commando via de set_action van de select.
      - if:
          condition:
            lambda: 'return id(knob_context) == 2;'
          then:
            - if:
                condition:
                  lambda: 'return delta > 0;'
                then:
                  - select.next:
                      id: hp_mode
                      cycle: false
                else:
                  - select.previous:
                      id: hp_mode
                      cycle: false

      # Context 3 = koppelpagina: door de lijst met gevonden OpenAmbers lopen
      - if:
          condition:
            lambda: 'return id(knob_context) == 3;'
          then:
            - lambda: |-
                lv_obj_t *r = id(pair_roller)->obj;
                int n = (int) lv_roller_get_option_cnt(r);
                int sel = (int) lv_roller_get_selected(r) + delta;
                if (sel < 0) sel = 0;
                if (sel > n - 1) sel = n - 1;
                lv_roller_set_selected(r, sel, LV_ANIM_ON);
