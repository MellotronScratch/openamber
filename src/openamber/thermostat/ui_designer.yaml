        - meter:
            id: climate_meter
            x: 0
            y: 0
            width: 450
            height: 450
            align: CENTER
            scales:
              - range_from: 0
                range_to: 100
                angle_range: 270
                rotation: 135
                ticks:
                  count: 65
                  width: 4
                  length: 25
                  color: 0x30333B
                  major:
                    stride: 8
                    width: 4
                    length: 31
                    color: 0x30333B
                    label_gap: -500
                indicators:
                  - tick_style:
                      color_start: 0x2EA8FF
                      color_end: 0xFF4D7E
                      start_value: 0
                      end_value: 63
                      local: false
            indicator:
              bg_opa: 0
            bg_color: 0x15161A
            border_width: 2
            border_color: 0x2A2D35
            radius: 9999
            text_opa: 0%
            pad_all: 17

