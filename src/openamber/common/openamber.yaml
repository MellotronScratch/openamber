substitutions:
  device_name: openamber
  device_friendly_name: OpenAmber
  device_project_name: jordi.openamber
  peer_mac: "E0:5A:1B:75:73:60"   # MAC van esp-thermostaat-1

packages:
  maintenance_proxy_switches: !include maintenance_proxy_switches.yaml
  maintenance_proxy_numbers: !include maintenance_proxy_numbers.yaml

external_components:
  - source:
      type: local
      path: openamber

openamber_component:
  id: amber_ctrl
  update_interval: 5s

debug:

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  project:
    name: ${device_project_name}
  includes:
    - openamber/controllers/constants.h
    - openamber/controllers/pump_controller.h
    - openamber/controllers/compressor_controller.h
    - openamber/controllers/base_controller.h
    - openamber/controllers/dhw_controller.h
    - openamber/controllers/heat_cool_controller.h
    - openamber/controllers/routine_controller.h
    - openamber/controllers/deaeration_routine.h
    - openamber/controllers/openamber_component.h
  on_boot:
    - priority: 600
      then:
        - script.execute: apply_pid_settings
        - script.execute: apply_thermostat_settings
        - delay: 5min
        - if:
            condition:
              lambda: 'return id(my_time).now().is_valid();'
            then:
              - update.check:
                  id: firmware_update
            else:
              - logger.log: "Skipping firmware update check until time is synchronized"
        - if:
            condition:
              - switch.is_on: analytics_enabled_switch
            then:
              - mqtt.enable:

espnow:
  peers:
    - ${peer_mac}
  on_receive:
    - address: ${peer_mac}
      then:
        - lambda: |-
            // Zet de ontvangen bytes om naar tekst ('data' en 'size' levert on_receive zelf aan).
            std::string s(data, data + size);
            // Waarden voor de commando's. NAN betekent "niet in dit pakket".
            float lo = NAN, hi = NAN;
            // De gewenste modus als tekst; leeg betekent "niet in dit pakket".
            std::string md;
            // Leespositie in de tekst, we beginnen bij het eerste teken.
            size_t pos = 0;
            // Herhaal zolang er nog tekst over is om te lezen.
            while (pos < s.size()) {
              // Zoek de eerstvolgende ';' (het einde van dit stukje).
              size_t end = s.find(';', pos);
              // Geen ';' meer? Dan loopt het laatste stukje tot het einde van de tekst.
              if (end == std::string::npos) end = s.size();
              // Knip het stukje eruit, bijvoorbeeld "bt=21.4".
              std::string item = s.substr(pos, end - pos);
              // Zoek het '=' dat de naam van de waarde scheidt.
              size_t eq = item.find('=');
              // Alleen doorgaan als er een '=' is gevonden (anders is het stukje onbruikbaar).
              if (eq != std::string::npos) {
                // Alles voor het '=' is de naam, bijvoorbeeld "bt".
                std::string key = item.substr(0, eq);
                // Alles na het '=' is de waarde als tekst, bijvoorbeeld "21.4".
                std::string val = item.substr(eq + 1);
                // Commando's: bewaren, ze worden hieronder in één keer toegepast.
                // Laag setpoint: tekst omzetten naar een getal.
                if (key == "slo")      lo = atof(val.c_str());
                // Hoog setpoint.
                else if (key == "shi") hi = atof(val.c_str());
                // Modus: als tekst bewaren ("heat", "cool" of "off").
                else if (key == "md")  md = val;
                // Sensorwaarden van de thermostaat: direct in de sensoren zetten.
                // Temperatuur van de BME680.
                else if (key == "bt")  id(thermostat_temp).publish_state(atof(val.c_str()));
                // Luchtvochtigheid.
                else if (key == "bh")  id(thermostat_hum).publish_state(atof(val.c_str()));
                // Dauwpunt (op de thermostaat berekend).
                else if (key == "dp")  id(thermostat_dewpoint).publish_state(atof(val.c_str()));
              }
              // Ga naar het volgende stukje, voorbij de ';' die we net hebben gevonden.
              pos = end + 1;
            }
            // Leeg wijzigingsverzoek voor de thermostaat van OpenAmber.
            auto call = id(climate_controller).make_call();
            // Houdt bij of er iets is om toe te passen.
            bool changed = false;
            // Alleen als beide setpoints in het pakket zaten...
            if (!std::isnan(lo) && !std::isnan(hi)) {
              // ...controleren of ze redelijk zijn: niet te laag, niet te hoog, laag niet boven hoog.
              if (lo >= 5 && hi <= 35 && lo <= hi) {
                // Zet de setpoints in het verzoek.
                call.set_target_temperature_low(lo);
                call.set_target_temperature_high(hi);
                // Onthoud dat er iets is om uit te voeren.
                changed = true;
              } else {
                // Buiten de grenzen: negeren en een waarschuwing loggen.
                ESP_LOGW("espnow", "Setpoints genegeerd: %.1f - %.1f", lo, hi);
              }
            }
            // Modus omzetten naar de bijbehorende thermostaatstand.
            if (md == "heat")      { call.set_mode(climate::CLIMATE_MODE_HEAT); changed = true; }
            else if (md == "cool") { call.set_mode(climate::CLIMATE_MODE_COOL); changed = true; }
            else if (md == "off")  { call.set_mode(climate::CLIMATE_MODE_OFF);  changed = true; }
            // Er is een commando binnengekomen en toegepast:
            if (changed) {
              // Voer het verzoek uit, zodat de thermostaat van OpenAmber zich aanpast.
              call.perform();
              // Alleen na een commando meteen de nieuwe stand terugmelden.
              id(espnow_send_status).execute();
            }

interval:
  - interval: 5min
    then:
      - if:
         condition:
          - switch.is_on: analytics_enabled_switch
         then:
          - script.execute: send_analytics
  - interval: 24h
    then:
      - if:
          condition:
            lambda: 'return id(my_time).now().is_valid();'
          then:
            - update.check:
                id: firmware_update
          else:
            - logger.log: "Skipping scheduled firmware update check until time is synchronized"
  - interval: 15s
    then:
      - script.execute: espnow_send_status
logger:
  level: INFO
  baud_rate: 0
  logs:
    modbus: ERROR
    espnow: INFO

api:
  reboot_timeout: 0s

# Broker used to push analytics data (Opt-In)
mqtt:
  id: mqtt_client
  broker: mqtt.openamber.nl
  enable_on_boot: false
  username: openamber_write
  password: openamber
  reboot_timeout: 0s
  discovery: false
  discover_ip: false
  discovery_retain: false
  log_topic: null
  topic_prefix: null
  on_connect:
    - if:
        condition:
          - switch.is_on: analytics_enabled_switch
        then:
          - script.execute: fetch_analytics_device_id

ota:
  - platform: esphome
  - platform: http_request

http_request:
  buffer_size_tx: 1024

update:
  - platform: http_request
    id: firmware_update
    name: Firmware Update
    source: http://openamber.nl/openamber.manifest.json

web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: overview
      name: "Overzicht"
      sorting_weight: 0
    - id: general_settings
      name: "Algemene instellingen"
      sorting_weight: 10
    - id: dhw_settings
      name: "Tapwater instellingen"
      sorting_weight: 20
    - id: dhw_schedule_settings
      name: "Tapwater schema instellingen"
      sorting_weight: 30
    - id: heating_settings
      name: "Verwarmingsinstellingen"
      sorting_weight: 40
    - id: cooling_settings
      name: "Koelinstellingen"
      sorting_weight: 45
    - id: temperature_sensors
      name: "Temperatuursensoren"
      sorting_weight: 50
    - id: diagnostic
      name: "Diagnostiek"
      sorting_weight: 60
    - id: error_codes
      name: "Foutcodes"
      sorting_weight: 70
    - id: manual_control
      name: "Handmatige bediening"
      sorting_weight: 80
    - id: config
      name: "Config"
      sorting_weight: 90

wifi:
  reboot_timeout: 0s
  ap:
    ssid: "OpenAmber"
    password: "openamber"

captive_portal:    

uart:
  baud_rate: 19200
  parity: EVEN

globals:
  - id: analytics_topic
    type: std::string
    restore_value: no
  - id: modbus_inside_is_online
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: analytics_batch_timestamp
    type: int64_t
    restore_value: no
    initial_value: '0'
  - id: modbus_outside_is_online
    type: bool
    restore_value: no
    initial_value: 'false'

datetime:
 - platform: template
   id: next_legionella_run
   name: "Volgende legionellapreventie"
   type: datetime
   restore_value: true
   optimistic: true
   initial_value: "2030-01-01 10:00:00"
   entity_category: config
   web_server: 
    sorting_group_id: dhw_settings

 - platform: template
   id: dhw_start_time
   type: time
   name: "Tapwater starttijd"
   optimistic: true
   initial_value: "10:00:00"
   restore_value: true
   entity_category: config
   web_server: 
    sorting_group_id: dhw_schedule_settings

 - platform: template
   id: dhw_end_time
   type: time
   name: "Tapwater eindtijd"
   optimistic: true
   initial_value: "17:00:00"
   restore_value: true
   entity_category: config
   web_server: 
    sorting_group_id: dhw_schedule_settings


# Use SNTP for time so we also have time when not connected to Home Assistant.
time:
  - platform: sntp
    id: my_time
    timezone: "Europe/Amsterdam"
    on_time:
      # Reset the hourly COP energy buckets at the top of every hour.
      - seconds: 0
        minutes: 0
        then:
          - sensor.integration.reset: thermal_energy_hour_heating
          - sensor.integration.reset: electrical_energy_hour_heating
          - sensor.integration.reset: thermal_energy_hour_cooling
          - sensor.integration.reset: electrical_energy_hour_cooling
          - sensor.integration.reset: thermal_energy_hour_dhw
          - sensor.integration.reset: electrical_energy_hour_dhw
      # Reset the daily COP energy buckets at midnight.
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - sensor.integration.reset: thermal_energy_day_heating
          - sensor.integration.reset: electrical_energy_day_heating
          - sensor.integration.reset: thermal_energy_day_cooling
          - sensor.integration.reset: electrical_energy_day_cooling
          - sensor.integration.reset: thermal_energy_day_dhw
          - sensor.integration.reset: electrical_energy_day_dhw
modbus_controller:
- id: modbus_outside_unit
  address: 0x2
  update_interval: 15s
  max_cmd_retries: 2
  on_offline:
    then:
      - lambda: |-
          id(modbus_outside_is_online) = false;
      - logger.log: "Modbus outside unit OFFLINE"
  on_online:
    then:
      - lambda: |-
          id(modbus_outside_is_online) = true;
      - logger.log: "Modbus outside unit ONLINE"
- id: modbus_inside_unit
  address: 0x0B
  update_interval: 15s
  max_cmd_retries: 2
  on_offline:
    then:
      - lambda: |-
          id(modbus_inside_is_online) = false;
      - logger.log: "Modbus inside unit OFFLINE"
  on_online:
    then:
      - lambda: |-
          id(modbus_inside_is_online) = true;
      - logger.log: "Modbus inside unit ONLINE"

climate: !include climates.yaml
sensor: !include sensors.yaml
text_sensor: !include text_sensors.yaml
binary_sensor: !include binary_sensors.yaml
number: !include numbers.yaml
switch: !include switches.yaml
select: !include selects.yaml
script: !include scripts.yaml

output:
  - platform: template
    id: pid_heat_output
    type: float
    write_action:
      - lambda: |-
          id(amber_ctrl).write_heat_pid_value(state);

  - platform: template
    id: pid_cool_output
    type: float
    write_action:
      - lambda: |-
          id(amber_ctrl).write_cool_pid_value(state);

  - platform: template
    id: pump_p0_pid_output
    type: float
    write_action:
      - lambda: |-
          id(amber_ctrl).write_pump_p0_pid_value(state);

button:
  - platform: factory_reset
    disabled_by_default: true
    name: Restart with Factory Default Settings
  - platform: restart
    id: restart_openamber
    name: Restart OpenAmber
  - platform: template
    id: dump_eeprom_parameters_button
    name: "Dump EEPROM parameters"
    disabled_by_default: true
    entity_category: diagnostic
    web_server:
      sorting_group_id: diagnostic
    on_press:
      - script.execute: dump_eeprom_parameters

preferences:
 flash_write_interval: 5min
